version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: collab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - collab-network

  db:
    image: postgres:15-alpine
    container_name: collab-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-collabeditor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - collab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: collab-backend
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-collabeditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      NODE_ENV: production
      EXECUTOR_URL: http://executor:5002
      JWT_SECRET: ${JWT_SECRET:-changeme}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - collab-network

  executor:
    build: ./executor
    container_name: collab-executor
    environment:
      PORT: 5002
      NODE_ENV: production
    networks:
      - collab-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  pgdata:

networks:
  collab-network:
    driver: bridge
